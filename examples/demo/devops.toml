schema = 1

[project]
name = "demo"
root = ".."

[[workloads]]
name = "api"
kind = "backend"
engine = "docker"
dockerfile = "hello/Dockerfile"
context = "hello"
platforms = ["linux/amd64"]

[[workloads]]
name = "web"
kind = "frontend"
engine = "docker"
dockerfile = "demo/frontend.Dockerfile"
context = "demo"
platforms = ["linux/amd64"]

[verification]
profile = "demo/checks.toml"

[postgres]
host = "127.0.0.1"
port = 5432
database = "demo"
username = "demo"
password_env = "DEMO_DB_PASSWORD"
sslmode = "require"
