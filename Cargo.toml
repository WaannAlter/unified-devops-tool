[package]
name = "unified-devops-tool"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
description = "Plan and run local container, publication, and delivery workflows"
license = "MIT"
repository = "https://github.com/WaannAlter/unified-devops-tool"
publish = false

[dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
toml = "0.9"
veriv-toolkit = { path = "../veriv-toolkit" }

[[bin]]
name = "devops-tool"
path = "src/main.rs"